# SPDX-License-Identifier: GPL-3.0-or-later
#
# Ficha do catálogo de extensões do IngeTrazo (ingetrazo-extensions).
#
# Como publicar (sem Git, pelo navegador):
#   1. Suba este repositório para o GitHub e crie a TAG v1.9.1 no commit em
#      que dist/IngeAnalisys.zip está (o download aponta para essa tag: o que
#      for revisado não pode mudar depois).
#   2. Em https://github.com/ingelibre/ingetrazo-extensions abra
#      Add file ▸ Create new file dentro de extensions/ com o nome
#      ingeanalisys.toml e cole este arquivo.
#   3. Suba screenshots/ingeanalisys.jpg (ou .png) para a pasta screenshots/
#      daquele repositório e abra o pull request.
#
# O SHA-256 tem de ser o do ZIP exato. Para recalcular depois de qualquer
# mudança no plugin:
#   python scripts/build_zip.py --update-catalog

# Same as the file name: lowercase letters, digits and _.
id = "ingeanalisys"
version = "1.9.1"

# AUTORIA: a extensão é de jufegofoto-cell (ver CREDITS.md). Este campo é o
# que aparece como autor no catálogo; o mantenedor das modificações é
# @em-rezende, citado em [description].
# Efeito colateral: o robô do catálogo publica sozinho as versões novas
# enviadas pela conta que está em author_url. Com a conta do autor original,
# cada versão nova deste fork passa por um mantenedor (mais lento, mais seguro).
author = "jufegofoto-cell"
author_url = "https://github.com/jufegofoto-cell"

# SPDX name of a free licence (LICENSE at the repository root).
license = "GPL-3.0-or-later"

# Where people read your code: the fork that builds the ZIP below. The
# download address has to be in this repository — the tagged file lives here.
repository = "https://github.com/em-rezende/IngeAnalisys"

# The exact file IngeTrazo installs: here, the package ZIP built from the
# IngeAnalisys folder (one folder with an __init__.py inside).
download = "https://raw.githubusercontent.com/em-rezende/IngeAnalisys/v1.9.1/dist/IngeAnalisys.zip"
# certutil -hashfile dist\IngeAnalisys.zip SHA256   (Linux/macOS: sha256sum)
sha256 = "efa2e512199314c8bd89cb0519dccbd6831103260ef8eeaa238b0f787d1cb138"

# The IngeTrazo version it was tested with.
ingetrazo = "0.6.1"

# 1 to 4 of: architecture, bim, structures, terrain, drawing, analysis,
# import-export, rendering, fabrication, productivity, education, other
tags = ["architecture", "analysis", "terrain"]

# A picture in screenshots/ of the catalog repository (under 600 KB).
# Built here by: python scripts/make_screenshot.py
screenshot = "ingeanalisys.jpg"

# Spanish and English are required; Portuguese is welcome.
[name]
es = "Análisis de Sitio"
en = "Site Analysis"
pt = "Análise de Sítio"

[summary]
es = "Sol 3D, sombras reales, viento, clima EPW, radiación solar, contexto de OpenStreetMap, masas y lotes con áreas e índices, anotaciones y exportación PNG, todo sobre el propio modelo."
en = "3D sun, real shadows, wind, EPW weather, solar radiation, OpenStreetMap context, masses and lots with areas and ratios, annotations and PNG export, all on the model itself."
pt = "Sol 3D, sombras reais, vento, clima EPW, radiação solar, contexto do OpenStreetMap, massas e lotes com áreas e índices, anotações e exportação PNG, tudo no próprio modelo."

# Optional, up to 2000 characters per language; the page shows it on the
# extension's own page. Here: authorship, which is the point of this entry.
[description]
es = """Extensión original de jufegofoto-cell (https://github.com/jufegofoto-cell/IngeAnalisys), que convirtió la app web «Análisis de Sitio 3D» en una extensión de IngeTrazo. Esta versión (1.9.1) es un fork mantenido por @em-rezende, con su autoría y su crédito intactos: añade internacionalización a nueve idiomas (pt-BR, es, en, de, it, fr, zh-CN, ru, ja), reorganiza el código en carpetas (tools/, i18n/, icons/), reúne todo en una barra de herramientas de 19 botones con iconos SVG y corrige atajos de teclado y la carga de diálogos. Los .igz hechos con la versión original se abren igual, porque se siguen leyendo sus claves. Licencia GPL-3.0-or-later. Detalles del crédito y de cada cambio: CREDITS.md en el repositorio."""
en = """Original extension by jufegofoto-cell (https://github.com/jufegofoto-cell/IngeAnalisys), who turned the «Análisis de Sitio 3D» web app into an IngeTrazo extension. This version (1.9.1) is a fork maintained by @em-rezende, with the original authorship and credit kept intact: it adds nine language catalogs (pt-BR, es, en, de, it, fr, zh-CN, ru, ja), lays the code out in folders (tools/, i18n/, icons/), gathers every command in one 19-button toolbar with SVG icons and fixes keyboard shortcuts and dialog loading. Projects made with the original version open the same way, because its data keys are still read. GPL-3.0-or-later. Credit and every change: CREDITS.md in the repository."""
pt = """Extensão original de jufegofoto-cell (https://github.com/jufegofoto-cell/IngeAnalisys), que transformou o app web «Análisis de Sitio 3D» em extensão do IngeTrazo. Esta versão (1.9.1) é um fork mantido por @em-rezende, com a autoria e o crédito originais preservados: acrescenta internacionalização para nove idiomas (pt-BR, es, en, de, it, fr, zh-CN, ru, ja), organiza o código em pastas (tools/, i18n/, icons/), reúne tudo em uma barra de ferramentas de 19 botões com ícones SVG e corrige atalhos de teclado e o carregamento de diálogos. Projetos feitos na versão original abrem igual, porque as chaves dela continuam sendo lidas. Licença GPL-3.0-or-later. Crédito e cada mudança: CREDITS.md no repositório."""
